[package]
name = "profession-archives"
version = "0.2.0"
description = "本地优先的个人生涯大脑 + 求职面试全生命周期管理平台"
edition = "2021"

# main.rs 引用 profession_archives_lib::run()，需显式命名 lib target
[lib]
name = "profession_archives_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tiny_http = "0.12"
ureq = { version = "2", features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdf-extract = "0.12"
base64 = "0.22"
zip = { version = "5", default-features = false, features = ["deflate"] }
